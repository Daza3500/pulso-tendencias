name: Actualizar tendencias

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recoger tendencias
        run: python fetch_trends.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Guardar resultado
        run: |
          git config user.name "pulso-bot"
          git config user.email "pulso-bot@users.noreply.github.com"
          git add data.json
          git commit -m "Actualizar tendencias" || echo "Sin cambios"
          git push
